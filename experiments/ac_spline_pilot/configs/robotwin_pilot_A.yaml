# Full 15-epoch dense pilot. Rank-64 WAN/Action LoRA and clean 45/5 split
# are inherited from the matched diagnostic configuration.
base_config: robotwin_research_A.yaml
research:
  phase: pilot
training:
  num_epochs: 15
  max_steps: null  # Derived from the validated training-window count.
  batch_size: 1
  gradient_accumulation_steps: 16
  warmup_steps: 200
  cycle_length: ${training.max_steps}
system:
  save_interval: 250
  val_interval: ${training.max_steps}
  checkpoint_dir: outputs/ac-pilot
logging:
  report_to: none
  run_name: pilot-seed-0
